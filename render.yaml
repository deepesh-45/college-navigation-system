# =================================================================
# RENDER BLUEPRINT CONFIGURATION FILE (render.yaml)
# Smart AI Campus Navigation System
# =================================================================

services:
  - type: web
    name: college-navigation-system
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_GEMINI_API_KEY
        sync: false
      - key: VITE_GEMINI_API_KEY_FALLBACK
        sync: false
      - key: VITE_SARVAM_API_KEY
        sync: false
      - key: VITE_SARVAM_API_KEY_FALLBACK
        sync: false
