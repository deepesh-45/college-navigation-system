# =================================================================
# RENDER BLUEPRINT CONFIGURATION FILE (render.yaml)
# Smart AI Campus Navigation System (Static Site)
# =================================================================

services:
  - type: static
    name: college-navigation-system
    buildCommand: npm run build
    publishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_GEMINI_API_KEY
        sync: false
      - key: VITE_GEMINI_API_KEY_FALLBACK
        sync: false
      - key: VITE_SARVAM_API_KEY
        sync: false
      - key: VITE_SARVAM_API_KEY_FALLBACK
        sync: false
