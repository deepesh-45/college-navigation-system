<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Smart Campus Sensor Data Collector (Mobile Standalone)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Patua+One&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .font-patua { font-family: 'Patua One', serif; }
  </style>
</head>
<body class="text-slate-900 selection:bg-blue-600 selection:text-white">
  <div class="min-h-screen flex flex-col justify-between max-w-md mx-auto bg-white border-x border-slate-200 shadow-2xl">
    
    <!-- Top Bar -->
    <header className="p-4 bg-white border-b border-slate-200 flex items-center justify-between sticky top-0 z-20 shadow-sm">
      <div className="flex items-center gap-2">
        <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white font-bold text-sm">
          📱
        </div>
        <div>
          <h1 class="font-patua text-base font-black text-blue-700 leading-none">CAMPUS DATA COLLECTOR</h1>
          <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mt-0.5">Standalone Mobile GPS & Step Sensor Tool</p>
        </div>
      </div>
      <button onclick="exportJSON()" class="px-3 py-1.5 rounded-xl bg-emerald-600 text-white font-bold text-xs shadow-sm">
        Export JSON
      </button>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-4 space-y-4 overflow-y-auto">
      
      <!-- Sensor Status Dashboard -->
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="p-2.5 rounded-2xl bg-slate-50 border border-slate-200">
          <span class="text-[9px] uppercase font-bold text-slate-400 block">GPS Fix</span>
          <span id="gpsStatus" class="text-xs font-extrabold text-blue-700">Acquiring...</span>
        </div>
        <div class="p-2.5 rounded-2xl bg-slate-50 border border-slate-200">
          <span class="text-[9px] uppercase font-bold text-slate-400 block">Compass</span>
          <span id="compassStatus" class="text-xs font-extrabold text-purple-700">0° N</span>
        </div>
        <div class="p-2.5 rounded-2xl bg-slate-50 border border-slate-200">
          <span class="text-[9px] uppercase font-bold text-slate-400 block">Steps / Dist</span>
          <span id="stepStatus" class="text-xs font-extrabold text-emerald-700">0 steps (0m)</span>
        </div>
      </div>

      <!-- Building & Floor Selector -->
      <div class="p-4 rounded-3xl bg-slate-50 border border-slate-200 space-y-2">
        <label class="text-[10px] font-bold uppercase text-slate-500 block">Building / Block Name:</label>
        <input id="buildingName" type="text" value="CSE & AI Engineering Block" class="w-full p-2 rounded-xl bg-white border border-slate-300 text-xs font-bold" />
        
        <div class="flex items-center justify-between pt-1">
          <label class="text-[10px] font-bold uppercase text-slate-500">Floor:</label>
          <select id="floorSelect" class="p-1.5 rounded-xl bg-white border border-slate-300 text-xs font-bold">
            <option value="0">Ground Floor (0)</option>
            <option value="1">Floor 1</option>
            <option value="2">Floor 2</option>
            <option value="3">Floor 3</option>
          </select>
        </div>
      </div>

      <!-- Node Input Form -->
      <div class="p-4 rounded-3xl bg-white border border-slate-200 shadow-md space-y-3">
        <h3 class="text-xs font-bold text-slate-900 uppercase tracking-wider flex items-center justify-between">
          <span>Mark Campus Node</span>
          <span id="nodeCountBadge" class="text-[10px] text-blue-700 font-extrabold bg-blue-50 px-2 py-0.5 rounded-full border border-blue-200">0 Nodes</span>
        </h3>

        <div>
          <label class="text-[10px] font-bold uppercase text-slate-500 block mb-1">Node Category:</label>
          <select id="nodeCategory" class="w-full p-2 rounded-xl bg-slate-50 border border-slate-300 text-xs font-bold">
            <option value="room">Classroom / Room</option>
            <option value="lab">AI / Engineering Lab</option>
            <option value="cabin">Faculty / HOD Cabin</option>
            <option value="entrance">Block Main Entrance</option>
            <option value="staircase">Staircase Landing</option>
            <option value="elevator">Elevator Lift Door</option>
            <option value="junction">Corridor Junction</option>
          </select>
        </div>

        <div>
          <label class="text-[10px] font-bold uppercase text-slate-500 block mb-1">Node / Room Name: *</label>
          <input id="nodeName" type="text" placeholder="e.g. AI Lab CS-204, HOD Office..." class="w-full p-2 rounded-xl bg-slate-50 border border-slate-300 text-xs font-semibold" />
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] font-bold uppercase text-slate-500 block mb-1">Room No:</label>
            <input id="roomNo" type="text" placeholder="CS-204" class="w-full p-2 rounded-xl bg-slate-50 border border-slate-300 text-xs font-semibold" />
          </div>
          <div>
            <label class="text-[10px] font-bold uppercase text-slate-500 block mb-1">Faculty Name:</label>
            <input id="facultyName" type="text" placeholder="Dr. Rajesh" class="w-full p-2 rounded-xl bg-slate-50 border border-slate-300 text-xs font-semibold" />
          </div>
        </div>

        <div class="p-3 rounded-2xl bg-indigo-50 border border-indigo-200 text-xs space-y-1">
          <span class="font-extrabold text-indigo-900 block text-[10px] uppercase">Path Connection from Last Node:</span>
          <div class="flex items-center gap-3">
            <label class="flex items-center gap-1 font-bold text-slate-700">
              <input type="checkbox" id="hasStairs" class="rounded text-blue-600" /> Has Stairs
            </label>
            <label class="flex items-center gap-1 font-bold text-slate-700">
              <input type="checkbox" id="hasElevator" class="rounded text-blue-600" /> Has Elevator
            </label>
          </div>
        </div>

        <button onclick="markNode()" class="w-full py-3 rounded-2xl bg-blue-700 text-white font-extrabold text-xs shadow-md">
          📍 Mark Node & Record Distance
        </button>
      </div>

      <!-- Log Table -->
      <div className="p-3 rounded-2xl bg-slate-50 border border-slate-200">
        <h4 class="text-[10px] font-bold uppercase text-slate-500 mb-2">Recorded Nodes & Distances:</h4>
        <div id="nodeLog" class="space-y-1.5 max-h-48 overflow-y-auto text-xs">
          <p class="text-slate-400 italic text-[11px]">No nodes marked yet. Tap button above to record.</p>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="p-3 bg-white border-t border-slate-200 text-center">
      <button onclick="exportJSON()" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white font-extrabold text-xs shadow-sm">
        ⬇️ Download Block Dataset JSON
      </button>
    </footer>
  </div>

  <script>
    let currentGps = null;
    let currentHeading = 0;
    let stepCount = 0;
    let lastAccelMag = 0;
    let lastGpsPos = null;

    let nodes = [];
    let edges = [];
    let lastNodeId = null;

    // Haversine Distance Formula in Meters
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const rad = Math.PI / 180;
      const dLat = (lat2 - lat1) * rad;
      const dLon = (lon2 - lon1) * rad;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*rad) * Math.cos(lat2*rad) * Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return Math.round(R * c);
    }

    // 1. Geolocation Watcher
    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition((pos) => {
        currentGps = {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          acc: Math.round(pos.coords.accuracy)
        };
        document.getElementById('gpsStatus').innerText = `±${currentGps.acc}m (${currentGps.lat.toFixed(4)})`;
      }, (err) => {
        document.getElementById('gpsStatus').innerText = 'Denied/Unavailable';
      }, { enableHighAccuracy: true });
    }

    // 2. Compass Orientation
    window.addEventListener('deviceorientation', (e) => {
      if (e.webkitCompassHeading) currentHeading = Math.round(e.webkitCompassHeading);
      else if (e.alpha) currentHeading = Math.round(360 - e.alpha);
      document.getElementById('compassStatus').innerText = `${currentHeading}° N`;
    }, true);

    // 3. Accelerometer Step Counter & Step Distance
    window.addEventListener('devicemotion', (e) => {
      const acc = e.accelerationIncludingGravity;
      if (!acc || !acc.x) return;
      const mag = Math.sqrt(acc.x*acc.x + acc.y*acc.y + acc.z*acc.z);
      const delta = Math.abs(mag - lastAccelMag);
      if (delta > 2.8 && lastAccelMag < 11.5 && mag > 11.5) {
        stepCount++;
        const estDistMeters = Math.round(stepCount * 0.75);
        document.getElementById('stepStatus').innerText = `${stepCount} steps (${estDistMeters}m)`;
      }
      lastAccelMag = mag;
    }, true);

    // Mark Node Function
    function markNode() {
      const name = document.getElementById('nodeName').value.trim();
      if (!name) { alert('Please enter a Node Name'); return; }

      const building = document.getElementById('buildingName').value;
      const floor = parseInt(document.getElementById('floorSelect').value);
      const category = document.getElementById('nodeCategory').value;
      const roomNo = document.getElementById('roomNo').value;
      const faculty = document.getElementById('facultyName').value;

      const nodeId = `N_F${floor}_${nodes.length + 1}`;
      const lat = currentGps ? currentGps.lat : 28.6148;
      const lng = currentGps ? currentGps.lng : 77.2102;

      // Calculate Real Distance from Last Node (GPS meters or Step meters)
      let distMeters = 15;
      if (lastGpsPos && currentGps) {
        const gpsDist = calculateDistance(lastGpsPos.lat, lastGpsPos.lng, lat, lng);
        const stepDist = Math.round(stepCount * 0.75);
        distMeters = Math.max(5, gpsDist > 0 ? gpsDist : stepDist || 15);
      }

      const nodeObj = {
        id: nodeId,
        building,
        floorNumber: floor,
        name,
        category,
        roomNo,
        faculty,
        lat,
        lng,
        heading: currentHeading,
        timestamp: new Date().toISOString()
      };

      nodes.push(nodeObj);

      if (lastNodeId) {
        const edgeObj = {
          from: lastNodeId,
          to: nodeId,
          distanceMeters: distMeters,
          stepsWalked: stepCount,
          stairs: document.getElementById('hasStairs').checked,
          elevator: document.getElementById('hasElevator').checked
        };
        edges.push(edgeObj);
      }

      lastNodeId = nodeId;
      lastGpsPos = { lat, lng };
      stepCount = 0; // Reset step counter for next node path segment

      // Reset form
      document.getElementById('nodeName').value = '';
      document.getElementById('roomNo').value = '';
      document.getElementById('facultyName').value = '';
      document.getElementById('hasStairs').checked = false;
      document.getElementById('hasElevator').checked = false;

      renderLog();
    }

    function renderLog() {
      document.getElementById('nodeCountBadge').innerText = `${nodes.length} Nodes Mapped`;
      const logDiv = document.getElementById('nodeLog');
      logDiv.innerHTML = nodes.map((n, i) => `
        <div class="p-2 bg-white rounded-xl border border-slate-200 flex items-center justify-between">
          <div>
            <strong class="text-slate-900">${i+1}. ${n.name}</strong>
            <span class="text-[10px] text-slate-500 block">Floor ${n.floorNumber} • ${n.category}</span>
          </div>
          <span class="text-[10px] font-bold text-blue-700">${n.lat.toFixed(4)}, ${n.lng.toFixed(4)}</span>
        </div>
      `).join('');
    }

    function exportJSON() {
      if (nodes.length === 0) { alert('No nodes marked yet.'); return; }
      const pkg = { building: document.getElementById('buildingName').value, nodes, edges };
      const blob = new Blob([JSON.stringify(pkg, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'mobile_collected_block_data.json';
      a.click();
    }
  </script>
</body>
</html>
